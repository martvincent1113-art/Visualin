plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.visualin.app'
    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig { applicationId 'com.visualin.app'; minSdk 24; targetSdk flutter.targetSdkVersion; versionCode flutter.versionCode; versionName flutter.versionName }
}

flutter { source '../..' }
